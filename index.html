<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Design Bingo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap');
      
      :root {
        --bg-color: #4c1d95;
        --card-bg: #ffffff;
      }

      body {
        font-family: 'Nunito', sans-serif;
        background-color: #4c1d95; /* Fallback */
        background-image: radial-gradient(circle at center, #8b5cf6 0%, #4c1d95 100%);
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      
      .font-cartoon {
        font-family: 'Fredoka', sans-serif;
      }
      
      /* Supercell-style 3D Button Utility */
      .game-card {
        transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0px 6px 0px 0px rgba(0,0,0,0.2);
      }
      .game-card:active {
        transform: translateY(4px);
        box-shadow: 0px 2px 0px 0px rgba(0,0,0,0.2);
      }

      .game-panel {
        background: white;
        border-radius: 24px;
        box-shadow: 
          0 10px 15px -3px rgba(0, 0, 0, 0.2), 
          0 4px 6px -2px rgba(0, 0, 0, 0.1),
          0 8px 0 rgba(0,0,0,0.2); /* 3D depth */
      }
      
      .text-stroke {
        -webkit-text-stroke: 4px rgba(0,0,0,0.2);
        paint-order: stroke fill;
      }
      
      .text-stroke-sm {
        -webkit-text-stroke: 2px rgba(0,0,0,0.1);
      }
      
      .avatar-ring {
        box-shadow: 0 0 0 4px #fbbf24, 0 6px 0 4px #d97706;
      }

      /* Moving Background Pattern */
      .bg-pattern-moving {
        background-image: radial-gradient(rgba(255, 255, 255, 0.15) 2px, transparent 2px);
        background-size: 40px 40px;
        animation: moveBackground 30s linear infinite;
      }

      @keyframes moveBackground {
        0% { background-position: 0 0; }
        100% { background-position: 40px 40px; }
      }

      /* Animations */
      @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        60% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      @keyframes bounce-hint {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05) rotate(2deg); filter: brightness(1.1); }
      }

      @keyframes wiggle {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }

      @keyframes click-pop {
        0% { transform: scale(0.95); }
        40% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      @keyframes drawLine {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      
      .animate-pop {
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      
      .animate-click-pop {
        animation: click-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }

      .animate-hint {
        animation: bounce-hint 1s ease-in-out infinite;
      }

      .animate-wiggle {
        animation: wiggle 0.3s ease-in-out infinite;
      }

      .animate-draw {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 1.5s ease-out forwards;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: #a78bfa;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #c4b5fd;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
